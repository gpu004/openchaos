[package]
name = "openchaos-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic instruction-count benchmarks under callgrind, trimmed from CodSpeed's simulation runner"
readme = "README.md"
keywords = ["benchmark", "valgrind", "callgrind", "deterministic"]
categories = ["development-tools::profiling"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
openchaos-core = { path = "../openchaos-core" }

[lints]
workspace = true
