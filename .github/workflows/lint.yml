name: lint

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, "1.86"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$TOOLCHAIN"
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.toolchain }}
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - if: matrix.toolchain != '1.86'
        run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-targets
      - run: |
          cargo build -p openchaos-bench --example sim_events
          cargo test -p openchaos-bench --test determinism -- --ignored
      - if: matrix.toolchain == 'stable'
        run: cargo doc --workspace --no-deps

  repo:
    name: repo hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: crate-ci/typos@53821664afd79bb88fcdd22fdc2f49d8d3f6cac9 # v1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: sh scripts/lint-arch.sh
      - run: uvx taplo fmt --check
      - run: uvx --from shellcheck-py shellcheck scripts/*.sh .githooks/*
      - run: uvx --from actionlint-py actionlint
      - run: uvx zizmor --pedantic .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
